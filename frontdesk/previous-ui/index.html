<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>卡秀 · 前台房态</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="identity"><span class="logo">卡</span><div><strong>卡秀商务酒店</strong><small>阿育王塔店 · 前台系统</small></div></div>
    <div class="nav-label">日常工作</div>
    <nav aria-label="主要功能">
      <button class="nav-item active" data-view="rooms"><span>▦</span>房态总览</button>
      <button class="nav-item" data-view="sync"><span>⇄</span>平台调房 <b id="navPending">—</b></button>
      <button class="nav-item" data-view="orders"><span>▤</span>订单与收款</button>
      <button class="nav-item" data-view="settings"><span>⚙</span>设置与备份</button>
    </nav>
    <div class="side-bottom"><div><i id="connectionDot"></i><span id="connectionText">正在连接本机</span></div><p>13 间客房 · 本机保存<br>携程 / 美团需人工核对</p></div>
  </aside>
  <main>
    <header class="topbar"><div><div class="eyebrow">KASHO / FRONT DESK</div><h1 id="pageTitle">房态总览</h1></div><div class="top-actions"><span class="today-label" id="clockLabel"></span><button class="primary" data-action="new">＋ 新增入住 / 预订</button></div></header>
    <div id="offline" class="notice danger hidden" role="alert">本机服务未连接，暂时不能保存。请重新打开 start-frontdesk.cmd，然后刷新页面。</div>
    <div id="overdue"></div>
    <section id="content" aria-live="polite"><div class="empty">正在加载房态…</div></section>
    <footer class="footnote">卡秀商务酒店（阿育王塔店） · 数据仅保存于这台电脑 · 离店当天不占当晚房量；在住未退房会保护今日房量</footer>
  </main>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
